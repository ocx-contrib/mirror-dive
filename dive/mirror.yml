# Single-package repository: every key this mirror needs is package-owned, so
# there is no `mirror-base.yml` and no `extends:` chain. That is deliberate —
# `extends:` is a SHALLOW merge of top-level keys, and `platforms:` is where it
# bites (it carries BOTH the runner matrix and the container legs, so a child
# that restates it to tweak one runner silently drops every `containers:`
# entry and nothing reds). With one spec there is nothing to merge and the trap
# does not exist. A second package here would move the genuinely repo-wide keys
# into a base — that is a content move, not a rename, and changes no generated
# workflow filename.

name: dive

# Logical index package `dive/dive` at the physical path
# `ghcr.io/ocx-contrib/dive/dive` — slash segments, never hyphen-flattened. Two
# segments always. `wagoodman` is Alex Goodman's personal handle, not a vendor
# identity, so under the fleet namespace rule the tool names itself; provenance
# lives in the claim's `upstream` block, not in the namespace. The first path
# segment must be this repo's own GitHub owner: GITHUB_TOKEN only authorises
# packages owned by the repository the workflow runs in.
target:
  registry: ghcr.io
  repository: ocx-contrib/dive/dive

source:
  type: github_release
  owner: wagoodman
  repo: dive
  # dive tags carry a "v" prefix (e.g. "v0.13.1"); the captured version does
  # not. The `\d+\.\d+\.\d+$` anchor is what keeps any future release-candidate
  # or snapshot tag out — every tag in the mirrored range is bare three-part
  # semver.
  tag_pattern: "^v(?P<version>\\d+\\.\\d+\\.\\d+)$"

skip_prereleases: true
cascade: true

# Bare semver versions (`0.13.1`) carry no `+build` segment, so the fleet
# default applies with no exception. A cascade tag (`latest`, `0`, `0.13`)
# re-points on every re-publish; without a build segment the new manifest would
# reuse the bare version tag and orphan the prior digest for registry GC,
# breaking any `@sha256:` pin in a consumer's ocx.lock.
build_timestamp: date

verify:
  github_asset_digest: true

# ─── libc gate (Phase 3.5) — the evidence, not the conclusion ───────────────
#
# dive is a single static Go binary. That is the claim; below is what was
# measured, on BOTH declared arches at BOTH ends of the mirrored range AND the
# release between them, because a toolchain can change mid-series — and it did
# here (0.12.0 carries a Go BuildID, 0.13.x a sha1 BuildID):
#
#   $ file 0.12.0/linux_amd64/dive
#   ELF 64-bit LSB executable, x86-64, version 1 (SYSV), statically linked, Go BuildID=…, stripped
#   $ file 0.12.0/linux_arm64/dive
#   ELF 64-bit LSB executable, ARM aarch64, version 1 (SYSV), statically linked, Go BuildID=…, stripped
#   $ file 0.13.0/linux_amd64/dive
#   ELF 64-bit LSB executable, x86-64, version 1 (SYSV), statically linked, BuildID[sha1]=ed7038a2…, stripped
#   $ file 0.13.1/linux_arm64/dive
#   ELF 64-bit LSB executable, ARM aarch64, version 1 (SYSV), statically linked, BuildID[sha1]=b4f6c611…, stripped
#
#   readelf -l <each> | grep -c INTERP           → 0   (all six: 3 versions × 2 arches)
#   readelf -d <each> | grep -c NEEDED           → 0   (all six)
#   readelf -V <each> | grep -o 'GLIBC_[0-9.]*'  → (no output — no versioned
#                                                   glibc symbol references)
#
# NOT a UPX false-static: `strings -a <each> | grep -c '^UPX'` → 0, and
# `readelf -h` reports real section headers (offset 456 on 0.12.0, 400 on
# 0.13.x — never 0), so the "statically linked" verdict is the linker's, not a
# packer stub's.
#
# Decisive cross-check — the binary was RUN under a musl userland, where a
# glibc-dynamic build would die at exec with 127:
#
#   $ docker run --rm -v …:/w:ro alpine:3.20 /w/0.13.1_linux_amd64/dive --version
#   dive 0.13.1                                                        (exit 0)
#
# No PT_INTERP, no DT_NEEDED, no GLIBC symbol versions, runs under musl. The
# artifact requires NOTHING of the host userland, so both Linux keys are BARE —
# no `+libc.*` suffix. `os.features` states what an artifact REQUIRES OF THE
# HOST, not how it was built: tagging a static binary `+libc.glibc` would hide
# it from every musl host it in fact runs on, and `+libc.musl` would hide it
# from every glibc host. Neither is true here.
#
# A bare key claims universality, so it must PROVE it: the container legs below
# are ubuntu (glibc) + alpine (musl) + fedora (a different glibc vintage) on
# both arches. THE ALPINE LEG IS THE PROOF — drop it and the universal claim is
# merely asserted.
#
# No `containers[].setup` on any leg, and that is a measured result rather than
# an omission: every invocation the smoke test makes was run inside stock
# ubuntu:24.04, alpine:3.20 and fedora:40 and behaved identically in all three.
# dive shells out to nothing on the paths the smoke exercises (its one external
# dependency, a container engine, is reached only by the image-analysis verb
# the smoke deliberately does not take — see tests/smoke.star).
#
# ─── Scope + resolution (verified on EVERY in-range release) ────────────────
#
# The mirrored range is exactly v0.12.0, v0.13.0 and v0.13.1 — three releases,
# re-listed per tag with
# `gh api repos/wagoodman/dive/releases/tags/<tag> --jq '.assets[].name'`
# rather than sampled from one. Every pattern below was matched against each of
# those three full asset lists: EXACTLY ONE match, every time, both ways. A
# pattern matching ZERO is silently skipped rather than reported as an error,
# which would yield a green run with a missing platform — so this check is not
# optional. No in-range release is asset-less, so the 0.12.0 floor needs no
# lift.
#
# Asset names ARE version-suffixed here, and they agree with their tag: v0.12.0
# ships only `dive_0.12.0_*`, v0.13.0 only `dive_0.13.0_*`, v0.13.1 only
# `dive_0.13.1_*`. Cross-checked by RUNNING each extracted binary —
# `dive --version` self-reports `dive 0.12.0`, `dive 0.13.0`, `dive 0.13.1`
# respectively — so no release re-ships a predecessor's build under a new tag.
#
# THE NAMING TRAP, defused by END-ANCHORING on the archive extension: each
# Linux arch ships THREE assets in the same release —
# `dive_<V>_linux_amd64.tar.gz`, `.deb` and `.rpm`. A pattern ending at the
# arch token matches all three and the resolver hard-errors as ambiguous. The
# `\.tar\.gz$` / `\.zip$` tail is what makes each pattern single-valued.
#
# Upstream also publishes, and this mirror deliberately does not carry:
#   dive_<V>_linux_ppc64le.{tar.gz,deb,rpm}   — from 0.13.0; ocx's Architecture
#                                               enum expresses only amd64 and
#                                               arm64, so ppc64le is an upstream
#                                               asset rather than a declarable
#                                               platform: nothing to gate, and
#                                               no reason to lift versions.min
#   dive_<V>_linux_{amd64,arm64}.{deb,rpm}    — distro sidecars
#   dive_<V>_checksums.txt                    — sidecar
assets:
  linux/amd64:
    - "^dive_\\d+\\.\\d+\\.\\d+_linux_amd64\\.tar\\.gz$"
  linux/arm64:
    - "^dive_\\d+\\.\\d+\\.\\d+_linux_arm64\\.tar\\.gz$"
  # ── Pass 2 (darwin) ───────────────────────────────────────────────────────
  # Uncommented in lockstep with the matching `platforms:` keys below. A
  # declared platform with no resolvable asset does NOT red — it boots a real
  # macOS/Windows runner and reports SUCCESS having tested nothing — so the
  # asset regex and its platform key move in the SAME pass.
  darwin/amd64:
    - "^dive_\\d+\\.\\d+\\.\\d+_darwin_amd64\\.tar\\.gz$"
  darwin/arm64:
    - "^dive_\\d+\\.\\d+\\.\\d+_darwin_arm64\\.tar\\.gz$"
  # ── Pass 3 (windows) ──────────────────────────────────────────────────────
  windows/amd64:
    - "^dive_\\d+\\.\\d+\\.\\d+_windows_amd64\\.zip$"
  windows/arm64:
    - "^dive_\\d+\\.\\d+\\.\\d+_windows_arm64\\.zip$"

# Every archive — tarball and zip alike — is FLAT: `dive` (`dive.exe` on
# Windows) sits at the archive root beside `CHANGELOG.md`, `LICENSE` and
# `README.md`, with no wrapper directory and no `bin/`. Verified with
# `tar tvzf` / `unzip -l` on all three in-range versions across linux + darwin
# + windows (12 archives):
#
#   -rw-r--r--      375  CHANGELOG.md
#   -rw-r--r--     1069  LICENSE
#   -rw-r--r--    11740  README.md
#   -rwxr-xr-x  9863352  dive
#
# So strip_components 0 on every platform — the binary lands at the content
# root — and one metadata.json (PATH = ${installPath}) serves all six.
# NOTE the two shapes that both take 0 and mean opposite things: a FLAT archive
# (this one) keeps the binary at ${installPath}; an archive WITH a top
# directory keeps that directory, making PATH ${installPath}/<topdir>. The
# `tar tvzf` transcript above is what distinguishes them.
asset_type:
  type: archive
  strip_components: 0

# FORCED by the flat archive, not chosen. `bin_scan` only inspects an
# interface-visible `${installPath}/<dir>` PATH entry, and this archive has no
# subdirectory to point one at, so both `auto` and `verify` fail spec load at
# exit 65:
#
#   bin_scan is enabled but metadata.json declares no interface-visible
#   ${installPath}/<dir> PATH entry — the verification would inspect no file
#   and pass green whatever the archive contains.
#
# The `binaries` list in metadata.json is therefore hand-maintained, exactly as
# that error directs. It is short and stable: `dive` (`dive.exe` on Windows) is
# the only mode-0755 entry in the archive; the three markdown/licence files are
# 0644 data. Quoted so no YAML 1.1 reader folds the bare word into boolean
# `false`.
bin_scan: "off"

metadata:
  default: metadata.json

catalog:
  logo: logo.svg

versions:
  # Assigned floor for this mirror. Every release from here up resolves both
  # declared Linux platforms (and, from pass 2/3, both darwin and both windows
  # platforms) with exactly one asset each.
  min: "0.12.0"
  new_per_run: 5
  # dive's release cadence is slow — v0.13.1 (2025-03-29) is the newest release
  # and there has been none since. The poll still runs on the fleet schedule:
  # its cost is one API call and the point is to catch the next release on the
  # day it lands, not to reflect how often that happens.
  poll_interval: "22 0-23/6 * * *"

tests:
  # `script:` resolves from the REPOSITORY ROOT — unlike `metadata.default` and
  # `catalog.logo` above, which resolve against this spec's own directory.
  - name: smoke
    script: dive/tests/smoke.star

# ─── Runner + container matrix ─────────────────────────────────────────────
platforms:
  linux/amd64:
    runner: ubuntu-latest
    containers:
      - { image: "ubuntu:24.04", shell: bash }
      - { image: "alpine:3.20",  shell: sh }
      - { image: "fedora:40",    shell: bash }
  linux/arm64:
    # arm64 container legs run natively — no qemu — so the runner arch must
    # match the platform or the renderer reds the leg up front.
    runner: ubuntu-24.04-arm
    containers:
      - { image: "ubuntu:24.04", shell: bash }
      - { image: "alpine:3.20",  shell: sh }
      - { image: "fedora:40",    shell: bash }
  # ── Pass 2 (darwin) ───────────────────────────────────────────────────────
  darwin/amd64:
    # Intel slice tested on the arm64 macos-15 runner via Rosetta 2 —
    # GitHub's native macos-13 Intel pool is exhausted and deadlocks push.
    runner: macos-15
    prefix: ["arch", "-x86_64"]
  darwin/arm64:
    runner: macos-15
    shell: bash
  # ── Pass 3 (windows) ──────────────────────────────────────────────────────
  windows/amd64:
    runner: windows-latest
    shell: pwsh
  windows/arm64:
    # Native arm64 Windows runner — the amd64 pool cannot execute an ARM64
    # PE, and upstream does ship dive_<V>_windows_arm64.zip on every in-range
    # release, so this leg resolves an asset and must exist here or push
    # reds it as missing_junit.
    runner: windows-11-arm
    shell: pwsh
  #
  # No `containers:` on darwin or windows — those runners have no Linux
  # container engine, and the key is rejected at spec load.

annotations:
  # From the Phase 1.5 license gate:
  #   $ gh api repos/wagoodman/dive/license --jq '.license.spdx_id'
  #   MIT
  org.opencontainers.image.licenses: "MIT"

notify:
  discord:
    webhook_secret: OCX_MIRROR_DISCORD_HOOK
    user_id: "227748867204972545"  # pinged in-message on failures

announce:
  # Spelled out, not derived from target.repository — the logical name and the
  # physical path are related by convention only.
  package: dive/dive
  fork: ocx-contrib/index
